# Binary wheels (Linux x86_64), EXPERIMENTAL: executables are linked with a static
# Fortran runtime and static reference LAPACK so that the wheel does not depend
# on libgfortran/liblapack of the target system.  Published to PyPI only for tags
# v*, and only if trusted publishing is configured for the repository on PyPI.
name: Wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_BEFORE_ALL_LINUX: >
            (dnf install -y --enablerepo=powertools gcc-gfortran lapack-static blas-static git ||
             dnf install -y --enablerepo=crb gcc-gfortran lapack-static blas-static git ||
             yum install -y gcc-gfortran lapack-static blas-static git)
          CIBW_ENVIRONMENT_LINUX: CMAKE_ARGS="-DDBSR_STATIC_RUNTIME=ON -DDBSR_LARGE_MEMORY=OFF"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pydbsr info && pytest -q {project}/tests -m "not slow"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
